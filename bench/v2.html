<!doctype html><meta charset="utf-8"><title>v2 dataset smoke</title>
<script type="module">
import * as THREE from 'three';
const base='/models/v2/';
const manifest=await (await fetch(base+'manifest.json')).json();
const structure=manifest.structures.find(x=>x.id==='bone:femur-l');
const record=structure.lod.low;
const response=await fetch(base+structure.category+'.low.bin.gz');
const payload=await response.arrayBuffer();
const signature=new Uint8Array(payload,0,2);
const gzipped=signature[0]===0x1f&&signature[1]===0x8b;
const binary=gzipped
  ? await new Response(new Blob([payload]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()
  : payload;
const positions=new Float32Array(binary,record.positions,record.vertexCount*3);
const normals=new Int16Array(binary,record.normals,record.vertexCount*3);
const indices=record.indexType==='u16'
  ? new Uint16Array(binary,record.indices,record.indexCount)
  : new Uint32Array(binary,record.indices,record.indexCount);
const geometry=new THREE.BufferGeometry();
geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));
geometry.setAttribute('normal',new THREE.BufferAttribute(normals,3,true));
geometry.setIndex(new THREE.BufferAttribute(indices,1));
geometry.computeBoundingBox();
const center=geometry.boundingBox.getCenter(new THREE.Vector3());
geometry.translate(-center.x,-center.y,-center.z);
geometry.computeBoundingSphere();
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(600,500);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b1220);
const camera=new THREE.PerspectiveCamera(40,600/500,0.05,10);
camera.position.set(0,0,0.6);
camera.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x223344,2));
scene.add(new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({color:0xdd8888})));
renderer.render(scene,camera);
window.__v2={
  structures:manifest.structures.length,
  excludedAggregates:manifest.excludedAggregates,
  name:structure.fr,
  vertices:record.vertexCount,
  triangles:record.indexCount/3,
  size:geometry.boundingBox.getSize(new THREE.Vector3()).toArray().map(v=>+v.toFixed(3)),
};
document.title='done';
</script>
