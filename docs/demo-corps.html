<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Corps humain animé — démonstration</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;background:#20242b;color:#eee;font:14px system-ui;display:flex;height:100vh}
  #ui{width:230px;padding:16px;box-sizing:border-box;background:#161a20;overflow:auto}
  #view{flex:1;min-width:0}
  h1{font-size:16px;margin:0 0 12px}
  label{display:block;margin:10px 0}
  select,button{width:100%;padding:6px;margin-top:4px;background:#2b313b;color:#eee;border:1px solid #444;border-radius:4px}
  #info{font-size:12px;color:#aaa;margin-top:16px;line-height:1.5}
</style>
<script type="importmap">
{"imports":{
 "three":"https://unpkg.com/three@0.187.0/build/three.module.js",
 "three/addons/":"https://unpkg.com/three@0.187.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="ui">
  <h1>Corps humain animé</h1>
  <label>Sexe<select id="sexe"><option value="female">Femme</option><option value="male">Homme</option></select></label>
  <label>Couche<select id="couche">
    <option value="skin">Peau</option><option value="muscles">Muscles</option>
    <option value="skeleton">Squelette</option><option value="organs">Organes</option>
    <option value="vessels">Vaisseaux</option><option value="nerves">Nerfs</option>
    <option value="all">Toutes</option>
  </select></label>
  <label>Animation<select id="anim"><option value="salsa">Salsa</option><option value="marche">Marche</option><option value="etirement">Étirement</option><option value="tourbillon">Tourbillon</option><option value="course">Course</option><option value="equilibre">Équilibre</option></select></label>
  <button id="play">Lecture / pause</button>
  <div id="info">Chargement…</div>
</div>
<div id="view"></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';

const el=document.getElementById('view');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x20242b);
const camera=new THREE.OrthographicCamera(-1,1,1,-1,0.01,20);
camera.position.set(0,0.85,4); camera.lookAt(0,0.85,0);
const renderer=new THREE.WebGLRenderer({antialias:true});
el.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x444455,1.6));
const key=new THREE.DirectionalLight(0xffffff,2.0); key.position.set(2,-3,3); scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,0.8); fill.position.set(-2,-1,1); scene.add(fill);

const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
let model=null, mixer=null, clips=[], playing=true, systemOf=new Map();
const clock=new THREE.Clock();

fetch('./models/catalog.json').then(r=>r.json()).then(c=>{
  for(const e of c) systemOf.set(e.key.toLowerCase(), e.system);
}).catch(()=>{});

function resize(){
  const w=el.clientWidth,h=el.clientHeight;
  renderer.setSize(w,h);
  const s=1.05, a=w/h;
  camera.left=-s*a; camera.right=s*a; camera.top=s; camera.bottom=-s;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);

function applyLayer(){
  if(!model)return;
  const layer=document.getElementById('couche').value;
  if(layer!=='skin'){
    if(mixer){mixer.stopAllAction();mixer.setTime(0);}
    playing=false;
  } else {
    playing=true;
    playClip();
  }
  let visible=0;
  model.traverse(o=>{
    if(!o.isMesh)return;
    const key=o.name.toLowerCase().replace(/[.\s]/g,'').replace(/(\D)\d+$/,'$1').replace(/_+$/,'');
    const sys=systemOf.get(key);
    o.visible = layer==='all' || sys===layer;
    if(o.visible)visible++;
  });
  document.getElementById('info').textContent=
    `${clips.length} animation(s), ${visible} maillage(s) visible(s)`;
}

function playClip(){
  if(!mixer)return;
  mixer.stopAllAction();
  const name=document.getElementById('anim').value;
  const clip=clips.find(c=>c.name.toLowerCase().includes(name));
  if(clip)mixer.clipAction(clip).play();
  else if(clips.length)mixer.clipAction(clips[0]).play();
}

async function load(){
  const sexe=document.getElementById('sexe').value;
  const url=`./models/corps-${sexe}-opt.glb`;
  if(model)scene.remove(model);
  const g=await loader.loadAsync(url);
  model=g.scene; scene.add(model);
  mixer=new THREE.AnimationMixer(model);
  window.__viewer={model,mixer,scene,camera,renderer};
  clips=g.animations;
  playClip();
  applyLayer(); resize();
}
for(const id of ['sexe','couche'])document.getElementById(id).addEventListener('change',load);
document.getElementById('anim').addEventListener('change',playClip);
document.getElementById('play').onclick=()=>playing=!playing;

function frame(){
  requestAnimationFrame(frame);
  const dt=clock.getDelta();
  if(mixer&&playing)mixer.update(dt);
  resize(); renderer.render(scene,camera);
}
load().catch(e=>document.getElementById('info').textContent='Erreur: '+e.message);
frame();
</script>
</body>
</html>
