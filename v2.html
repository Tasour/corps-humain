<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CORPS — Atlas complet v2</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #070d16; color: #dce7f2; font: 14px/1.45 system-ui, sans-serif; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    .panel { background: rgba(9,18,30,.86); border: 1px solid #21384f; border-radius: 12px; padding: 10px 12px; backdrop-filter: blur(6px); }
    .title { font-weight: 700; letter-spacing: .12em; font-size: 11px; color: #67e8f9; }
    .sub { color: #8297ad; font-size: 12px; margin-top: 2px; }
    .top { position: fixed; z-index: 6; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; gap: 10px; pointer-events: none; }
    .top > * { pointer-events: auto; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    button { cursor: pointer; border: 1px solid #29435c; background: #102033; color: #cfe0ee; border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 12px; }
    button.active { background: #1d5d76; border-color: #4fd1e0; color: #eafcff; }
    #sidebar { position: fixed; z-index: 6; left: 14px; top: 132px; bottom: 14px; width: 310px; display: flex; flex-direction: column; gap: 8px; }
    #search { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #29435c; background: #0d1b2b; color: #dce7f2; font: inherit; font-size: 13px; }
    #shortcuts, #groups { display: flex; gap: 5px; flex-wrap: wrap; padding: 8px; }
    #shortcuts button, #groups button { font-size: 11px; padding: 4px 8px; }
    #list { flex: 1; overflow: auto; padding: 6px; }
    .group { font-size: 10px; letter-spacing: .1em; color: #5f7f99; text-transform: uppercase; padding: 9px 8px 4px; }
    .item { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: #c8d8e6; border-radius: 7px; padding: 6px 8px; font-size: 12px; }
    .item:hover { background: #16293d; }
    .item.active { background: #1c5369; color: #eafcff; }
    .item small { color: #6e8aa4; margin-left: 6px; }
    #info { position: fixed; z-index: 6; right: 14px; bottom: 14px; width: min(330px, calc(100vw - 28px)); }
    #perf { min-width: 240px; }
    #perf b { color: #7ee7c7; font-size: 18px; }
    #label { position: fixed; z-index: 7; pointer-events: none; display: none; transform: translate(-50%, -150%); background: rgba(8,20,32,.9); border: 1px solid #4fd1e0; border-radius: 6px; padding: 3px 8px; font-size: 12px; color: #eafcff; white-space: nowrap; }
    #info .chips { margin-top: 8px; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #070d16; z-index: 20; transition: opacity .4s; }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #mobile-toggle { display: none; }
    @media (max-width: 700px) {
      #sidebar { left: 8px; right: 8px; top: 130px; bottom: 120px; width: auto; display: none; }
      #sidebar.open { display: flex; }
      #mobile-toggle { display: inline-block; }
      #info { right: 8px; bottom: 8px; }
      .top { left: 8px; right: 8px; top: 8px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading"><div class="panel"><div class="title">CORPS · ATLAS COMPLET V2</div><div class="sub" id="load-text">Chargement…</div></div></div>
  <div class="top">
    <div class="panel">
      <div class="title">CORPS — ATLAS COMPLET</div>
      <div class="sub" id="count">— structures</div>
      <div class="chips">
        <button data-cat="bone">Os</button>
        <button data-cat="muscle">Muscles</button>
        <button data-cat="organ" class="active">Organes</button>
        <button data-cat="skin" class="active">Peau</button>
        <button id="mobile-toggle">Explorer</button>
        <button id="reset">Recadrer</button>
      </div>
    </div>
    <div class="panel" id="perf"><div class="title">PERFORMANCE</div><b id="fps">—</b><div class="sub" id="draw">—</div><div class="sub" id="quality">qualité —</div></div>
  </div>
  <div id="sidebar">
    <input id="search" type="search" placeholder="Rechercher un organe, un os, un muscle, un code TA2…" autocomplete="off" />
    <div class="panel" id="shortcuts"></div>
    <div class="panel" id="groups"></div>
    <div class="panel" id="list"></div>
  </div>
  <div id="label"></div>
  <div class="panel" id="info">
    <div class="title">STRUCTURE SÉLECTIONNÉE</div>
    <div class="sub" id="sel-name">Cliquez sur une structure ou dans la liste.</div>
    <div class="sub" id="sel-meta"></div>
    <div class="chips"><button id="focus">Focus</button><button id="isolate">Isoler</button><button id="clear-iso">Tout afficher</button></div>
    <div class="chips" id="group-actions" style="display:none"><button id="explode">Éclater</button><button id="move">Mouvement</button><button id="group-reset">Réinitialiser</button></div>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { AnatomyV2Engine } from './src/v2-engine.js';
    import { QUICK_ACCESS, GROUPS } from './src/data/groups.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    document.getElementById('app').appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080f1b);
    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.05, 30);
    camera.position.set(0.72, 1.28, 2.55);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.0, 0);
    controls.enableDamping = true;
    controls.minDistance = 0.12;
    controls.maxDistance = 6;
    controls.update();
    scene.add(new THREE.HemisphereLight(0xeaf6ff, 0x1c2b3b, 2.1));
    const key = new THREE.DirectionalLight(0xffffff, 1.2);
    key.position.set(1, 2, 2);
    scene.add(key);

    const engine = new AnatomyV2Engine({ lod: 'low' });
    await engine.load((p, label) => {
      document.getElementById('load-text').textContent = `${label} — ${Math.round(p * 100)} %`;
    });
    engine.addTo(scene);
    for (const cat of ['bone', 'muscle', 'organ']) engine.setCategoryVisible(cat, cat === 'organ');
    engine.setCategoryVisible('skin', true);
    document.getElementById('count').textContent =
      `${engine.stats.structures} structures · ${Math.round(engine.stats.triangles / 1000)}k triangles`;
    document.getElementById('loading').classList.add('hidden');

    const labels = { bone: 'Os', muscle: 'Muscles', organ: 'Organes', skin: 'Peau' };
    const subsystemLabels = {
      arterial: 'Artères', venous: 'Veines', cardiac: 'Cœur',
      nervous: 'Nerfs', sensory: 'Sens', lymphatic: 'Lymphatique',
      digestive: 'Digestion', respiratory: 'Respiration', urinary: 'Urinaire',
      reproductive: 'Reproduction', endocrine: 'Endocrine',
      integumentary: 'Téguments', 'Nerveux et sens': 'Nerveux et sens',
      Viscéral: 'Viscéral', Lymphoïde: 'Lymphoïde', Cardiovasculaire: 'Cardiovasculaire',
    };
    let selected = null;
    let detailStructure = null;
    let cameraTween = null;
    let forceCulling = false;
    let lodBias = 1;
    let pixelRatio = Math.min(devicePixelRatio, 1.5);

    function renderList() {
      const query = document.getElementById('search').value.trim().toLowerCase();
      const list = document.getElementById('list');
      const matches = engine.structures.filter((s) =>
        !query || `${s.fr} ${s.en} ${s.la} ${s.ta2}`.toLowerCase().includes(query),
      ).slice(0, 400);
      const groups = new Map();
      for (const s of matches) {
        const key = s.category === 'organ' && s.subsystem
          ? `organ:${s.subsystem}` : s.category;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(s);
      }
      let html = '';
      for (const [key, items] of groups) {
        const cat = key.split(':')[0];
        const sub = key.includes(':') ? subsystemLabels[key.split(':')[1]] || key.split(':')[1] : '';
        html += `<div class="group">${labels[cat] || cat}${sub ? ' · ' + sub : ''} (${items.length})</div>`;
        for (const s of items) {
          const side = s.side === 'left' ? ' · G' : s.side === 'right' ? ' · D' : '';
          html += `<button class="item${selected === s ? ' active' : ''}" data-id="${s.id}">` +
            `${s.fr || s.en}${side}<small>${s.ta2 || ''}</small></button>`;
        }
      }
      if (!matches.length) html = '<div class="group">Aucun résultat</div>';
      list.innerHTML = html;
      list.querySelectorAll('.item').forEach((button) => {
        button.addEventListener('click', () => {
          const structure = engine.byId.get(button.dataset.id);
          if (structure) selectStructure(structure, true);
        });
      });
    }

    async function selectStructure(structure, focus) {
      if (!structure) return;
      if (selected) engine.highlight(selected, '#ffffff');
      if (detailStructure && detailStructure !== structure) {
        await engine.setStructureLod(detailStructure, 'low');
      }
      selected = structure;
      detailStructure = null;
      engine.highlight(structure, '#7ef9ff');
      const detailLevel = (innerWidth < 700 || (navigator.deviceMemory || 4) <= 4) ? 'medium' : 'high';
      document.getElementById('sel-name').textContent = structure.fr || structure.en;
      const sideLabel = structure.side === 'left' ? ' · G' : structure.side === 'right' ? ' · D' : '';
      document.getElementById('sel-meta').textContent = `${labels[structure.category] || ''}${sideLabel} · TA2 ${structure.ta2 || '—'} · chargement…`;
      if (structure.lod?.[detailLevel]) {
        const ok = await engine.setStructureLod(structure, detailLevel);
        detailStructure = structure;
        document.getElementById('sel-meta').textContent =
          `${labels[structure.category] || ''}${sideLabel} · TA2 ${structure.ta2 || '—'} · ${ok ? structure.lod[detailLevel].indexCount / 3 : structure.lod.low.indexCount / 3} tris (${detailLevel})`;
      }
      forceCulling = true;
      if (focus) {
        const target = engine.focusTarget(structure);
        if (target) {
          const dir = camera.position.clone().sub(controls.target).normalize();
          cameraTween = {
            fromPos: camera.position.clone(),
            toPos: target.center.clone().addScaledVector(dir, Math.max(0.35, target.radius * 5)),
            fromTarget: controls.target.clone(),
            toTarget: target.center,
            t: 0,
          };
        }
      }
      renderList();
    }

    document.getElementById('search').addEventListener('input', renderList);
    renderList();

    const shortcutsEl = document.getElementById('shortcuts');
    for (const item of QUICK_ACCESS) {
      const button = document.createElement('button');
      button.textContent = item.label;
      button.addEventListener('click', () => {
        const first = engine.byId.get(item.ids[0]);
        if (first) selectStructure(first, true);
      });
      shortcutsEl.appendChild(button);
    }
    const groupsEl = document.getElementById('groups');
    let activeGroup = null;
    let groupAnim = null;
    for (const group of GROUPS) {
      const button = document.createElement('button');
      button.textContent = group.label;
      button.addEventListener('click', () => {
        activeGroup = group;
        engine.resetGroupTransforms();
        const count = engine.showGroup(group);
        document.getElementById('sel-name').textContent = group.label;
        document.getElementById('sel-meta').textContent = `${count} structures · ${group.movement || 'vue de groupe'}`;
        document.getElementById('group-actions').style.display = 'flex';
        const members = group.members.map((id) => engine.byId.get(id)).filter(Boolean);
        const c = members.reduce((acc, s) => {
          const b = s.bounds;
          acc.x += (b.min[0] + b.max[0]) / 2;
          acc.y += (b.min[1] + b.max[1]) / 2;
          acc.z += (b.min[2] + b.max[2]) / 2;
          return acc;
        }, { x: 0, y: 0, z: 0 });
        const n = Math.max(1, members.length);
        c.x /= n; c.y /= n; c.z /= n;
        const dir = camera.position.clone().sub(controls.target).normalize();
        cameraTween = {
          fromPos: camera.position.clone(),
          toPos: new THREE.Vector3(c.x, c.y, c.z).addScaledVector(dir, 1.1),
          fromTarget: controls.target.clone(),
          toTarget: new THREE.Vector3(c.x, c.y, c.z),
          t: 0,
        };
      });
      groupsEl.appendChild(button);
    }
    document.getElementById('explode').addEventListener('click', () => {
      if (activeGroup) groupAnim = { group: activeGroup, mode: 'explode', t: 0, dir: 1 };
    });
    document.getElementById('move').addEventListener('click', () => {
      if (activeGroup) groupAnim = { group: activeGroup, mode: 'movement', t: 0, dir: 1 };
    });
    document.getElementById('group-reset').addEventListener('click', () => {
      groupAnim = null;
      engine.resetGroupTransforms();
      if (activeGroup) engine.showGroup(activeGroup);
      forceCulling = true;
    });

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let downX = 0, downY = 0;
    renderer.domElement.addEventListener('pointerdown', (event) => { downX = event.clientX; downY = event.clientY; });
    renderer.domElement.addEventListener('pointerup', async (event) => {
      if (Math.hypot(event.clientX - downX, event.clientY - downY) > 5) return;
      pointer.x = (event.clientX / innerWidth) * 2 - 1;
      pointer.y = -(event.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      await selectStructure(engine.pick(raycaster), false);
    });

    document.querySelectorAll('[data-cat]').forEach((button) => {
      button.addEventListener('click', () => {
        button.classList.toggle('active');
        engine.setCategoryVisible(button.dataset.cat, button.classList.contains('active'));
      });
    });
    document.getElementById('focus').addEventListener('click', () => {
      if (!selected) return;
      engine.setCategoryVisible(selected.category, true);
      const dir = camera.position.clone().sub(controls.target).normalize();
      engine.isolate(selected);
      const target = engine.focusTarget(selected);
      if (target) {
        cameraTween = {
          fromPos: camera.position.clone(),
          toPos: target.center.clone().addScaledVector(dir, Math.max(0.25, target.radius * 4)),
          fromTarget: controls.target.clone(),
          toTarget: target.center,
          t: 0,
        };
      }
      forceCulling = true;
    });
    document.getElementById('isolate').addEventListener('click', () => {
      if (selected) { engine.isolate(selected); forceCulling = true; }
    });
    document.getElementById('clear-iso').addEventListener('click', () => {
      engine.isolate(null);
      engine.highlight(selected, '#7ef9ff');
      forceCulling = true;
    });
    document.getElementById('mobile-toggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });
    document.getElementById('reset').addEventListener('click', () => {
      camera.position.set(0.72, 1.28, 2.55);
      controls.target.set(0, 1.0, 0);
      cameraTween = null;
      controls.update();
    });
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    let visibleCount = engine.updateVisibility(camera);
    let lastCamera = camera.position.clone();
    let frames = 0, last = performance.now(), frameSum = 0, frameCount = 0;
    const fpsEl = document.getElementById('fps');
    const drawEl = document.getElementById('draw');
    const labelEl = document.getElementById('label');
    const qualityEl = document.getElementById('quality');
    const maxRatio = Math.min(devicePixelRatio, 1.5);
    function loop() {
      requestAnimationFrame(loop);
      if (cameraTween) {
        cameraTween.t = Math.min(1, cameraTween.t + 0.045);
        const e = 1 - Math.pow(1 - cameraTween.t, 3);
        camera.position.lerpVectors(cameraTween.fromPos, cameraTween.toPos, e);
        controls.target.lerpVectors(cameraTween.fromTarget, cameraTween.toTarget, e);
        if (cameraTween.t >= 1) cameraTween = null;
      }
      if (groupAnim) {
        groupAnim.t += 0.012 * groupAnim.dir;
        if (groupAnim.t >= 1) { groupAnim.t = 1; groupAnim.dir = -1; }
        if (groupAnim.t <= 0) { groupAnim.t = 0; groupAnim.dir = 1; }
        engine.animateGroup(groupAnim.group, groupAnim.t, groupAnim.mode);
      }
      controls.update();
      if (selected) {
        const target = engine.focusTarget(selected);
        if (target) {
          const p = target.center.clone().project(camera);
          if (p.z < 1 && Math.abs(p.x) < 1.2 && Math.abs(p.y) < 1.2) {
            labelEl.style.display = 'block';
            labelEl.style.left = `${(p.x * 0.5 + 0.5) * innerWidth}px`;
            labelEl.style.top = `${(-p.y * 0.5 + 0.5) * innerHeight}px`;
            labelEl.textContent = selected.fr || selected.en;
          } else {
            labelEl.style.display = 'none';
          }
        }
      } else {
        labelEl.style.display = 'none';
      }
      if (camera.position.distanceToSquared(lastCamera) > 1e-6 || forceCulling) {
        lastCamera.copy(camera.position);
        forceCulling = false;
        visibleCount = engine.updateVisibility(camera, lodBias);
      }
      const t0 = performance.now();
      renderer.render(scene, camera);
      const renderMs = performance.now() - t0;
      frames++; frameSum += renderMs; frameCount++;
      const now = performance.now();
      if (now - last >= 500) {
        const avg = frameSum / Math.max(1, frameCount);
        if (avg > 8 && pixelRatio > 1) {
          pixelRatio = Math.max(1, pixelRatio - 0.25);
          renderer.setPixelRatio(pixelRatio);
          lodBias = Math.max(0.6, lodBias - 0.1);
          forceCulling = true;
        } else if (avg < 3.5 && pixelRatio < maxRatio) {
          pixelRatio = Math.min(maxRatio, pixelRatio + 0.25);
          renderer.setPixelRatio(pixelRatio);
          lodBias = Math.min(1, lodBias + 0.1);
          forceCulling = true;
        }
        fpsEl.textContent = Math.round((frames * 1000) / (now - last)) + ' fps';
        drawEl.textContent = `${renderer.info.render.calls} appels · ${Math.round(renderer.info.render.triangles / 1000)}k tris · ${visibleCount} visibles · ${avg.toFixed(1)} ms CPU`;
        qualityEl.textContent = `qualité ${pixelRatio.toFixed(2)}× · LOD ${lodBias.toFixed(1)}`;
        frames = 0; frameSum = 0; frameCount = 0; last = now;
      }
    }
    loop();
    window.__v2 = engine;
  </script>
</body>
</html>
