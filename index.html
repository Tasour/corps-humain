<!doctype html>
<!-- Correctif design 2026-11-24 : noms accessibles, cibles 44 px et grille 8 pt. -->
<html lang="fr" data-build="DEV">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10151b" />
    <title>CORPS — Anatomie en position croix</title>
    <meta name="description" content="Corps humain 3D statique en position croix : peau, muscles, squelette, organes, vaisseaux et nerfs affichés ensemble." />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <style>
      :root { color-scheme: dark; --paper:#10151b; --ink:#e8ecef; --muted:#9aa8b3; --line:#2b3540; --accent:#7fd4d0; }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.45 system-ui,sans-serif; overflow:hidden; }
      header { height:calc(58px + env(safe-area-inset-top)); display:flex; align-items:center; justify-content:space-between; gap:12px;
        padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));
        border-bottom:1px solid var(--line); background:#151c24; }
      .brand { display:flex; align-items:center; gap:12px; min-width:0; }
      .brand img { width:32px; height:32px; }
      .brand h1 { margin:0; font:600 18px/1.4 Georgia,serif; letter-spacing:.14em; }
      .build { color:var(--muted); font:11px/1.4 monospace; white-space:nowrap; }
      a.atlas { display:inline-flex; align-items:center; justify-content:center; min-height:44px; min-width:44px;
        padding:0 12px; border:1px solid var(--line); border-radius:8px; background:#202a35; color:var(--ink);
        text-decoration:none; font-size:13px; }
      a.atlas:active { transform:scale(.97); }
      .source-label { display:inline-flex; align-items:center; min-height:44px; padding:0 12px;
        border:1px solid var(--line); border-radius:8px; color:var(--muted); font-size:12px; white-space:nowrap; }
      main { height:calc(100vh - 58px - env(safe-area-inset-top)); display:grid; grid-template-columns:56px minmax(0,1fr); position:relative; }
      #toolbar { display:flex; flex-direction:column; gap:8px; padding:8px; border-right:1px solid var(--line);
        background:#111820; overflow:auto; }
      #toolbar button { width:44px; min-width:44px; height:44px; min-height:44px; margin:0; padding:0; border-radius:8px;
        font-size:11px; font-weight:600; letter-spacing:.02em; }
      #toolbar button[aria-expanded="true"] { background:#2a4a4d; border-color:var(--accent); }
      #viewport { position:relative; min-width:0; min-height:0; }
      .panel { position:absolute; left:64px; top:12px; z-index:10; width:240px; max-width:calc(100vw - 76px);
        padding:16px; border:1px solid var(--line); border-radius:8px; background:rgba(21,28,36,.97);
        box-shadow:0 12px 32px rgba(0,0,0,.45); }
      .panel[hidden] { display:none; }
      .avertissement { margin:12px 0 0; color:var(--muted); font-size:12px; line-height:1.4; }
      .source-note { margin:12px 0 0; color:var(--accent); font-size:12px; line-height:1.4; }
      .panel h2 { margin:0 0 12px; font-size:15px; }
      .panel label { display:block; margin:12px 0 0; color:var(--muted); font-size:12px; }
      select { width:100%; min-height:44px; margin-top:4px; padding:8px 12px; border:1px solid #44515f;
        border-radius:8px; background:#232e3a; color:var(--ink); font-size:15px; }
      fieldset.couches { border:0; padding:0; margin:12px 0 0; min-width:0; }
      fieldset.couches legend { padding:0; color:var(--muted); font-size:12px; }
      fieldset.couches label { display:flex; align-items:center; gap:8px; min-height:44px;
        margin:0; color:var(--ink); font-size:13px; cursor:pointer; }
      fieldset.couches input[type="checkbox"] { flex:0 0 auto; width:20px; height:20px;
        margin:0; accent-color:var(--accent); cursor:pointer; }
      fieldset.couches label.maitre { font-weight:600; border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:4px; }
      #corps-info { margin-top:12px; color:var(--muted); font-size:12px; }
      #cp-view { position:absolute; inset:0; min-width:0; min-height:0; overflow:hidden; }
      #cp-view canvas { display:block; width:100%; height:100%; touch-action:none; }
      #cp-view:focus-visible { outline:3px solid var(--accent); outline-offset:-3px; }
      #nav-commands { position:absolute; right:12px; bottom:12px; z-index:12; display:grid;
        grid-template-columns:repeat(2,44px); gap:8px; }
      #nav-commands button { width:44px; height:44px; min-width:44px; min-height:44px; margin:0;
        padding:0; border-radius:8px; font-size:11px; font-weight:600; }
      .presets { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:8px; }
      .presets button { min-height:44px; padding:0 8px; border-radius:8px; font-size:12px; font-weight:600; }
      #pivot-indicator { position:absolute; right:12px; top:12px; z-index:11; padding:4px 8px;
        border:1px solid var(--line); border-radius:8px; background:rgba(16,22,29,.88);
        color:var(--muted); font-size:11px; pointer-events:none; }
      #selection-popup { position:absolute; z-index:14; width:min(280px,calc(100vw - 24px));
        padding:16px 44px 16px 16px; border:1px solid var(--accent); border-radius:12px;
        background:rgba(16,22,29,.97); box-shadow:0 10px 30px rgba(0,0,0,.5); }
      #selection-popup[hidden] { display:none; }
      #selection-popup h2 { margin:0 0 8px; font-size:15px; color:var(--accent); }
      #selection-popup p { margin:8px 0 0; font-size:13px; line-height:1.45; }
      #selection-close { position:absolute; right:8px; top:8px; width:44px; height:44px;
        min-width:44px; min-height:44px; margin:0; padding:0; border-radius:8px; font-size:18px; }
      @media (pointer:coarse) {
        #cp-view::after { content:'Glissez pour tourner · pincez pour zoomer'; position:absolute; left:8px; bottom:8px;
          background:rgba(0,0,0,.55); color:#e6e6e6; font-size:11px; padding:4px 8px; border-radius:8px; pointer-events:none; }
      }
      @media (max-width:700px) {
        main { grid-template-columns:52px minmax(0,1fr); }
        #toolbar { padding:8px 4px; }
        #toolbar button { width:44px; min-width:44px; }
        .panel { left:58px; top:8px; width:min(240px,calc(100vw - 68px)); }
        #selection-popup { left:12px !important; right:12px; top:auto !important; bottom:12px; width:auto; }
        .build { display:none; }
      }
      .skip-link { position:absolute; left:8px; top:-48px; z-index:20; padding:8px 12px;
        background:#e8ecef; color:#10151b; border-radius:4px; font-size:13px; }
      .skip-link:focus { top:8px; }
      @media (prefers-reduced-motion:reduce) {
        *,*::before,*::after { transition-duration:.01ms !important; animation-duration:.01ms !important; }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#cp-view">Aller au corps 3D</a>
    <header>
      <div class="brand"><img src="./logo.svg" alt="" /><h1>CORPS</h1><span class="build" id="build-label"></span></div>
      <span class="source-label">Anatomie 3D</span>
    </header>
    <main>
      <nav id="toolbar" aria-label="Outils d'interface">
        <button type="button" data-panel="couches" aria-expanded="false" aria-controls="panel-couches" title="Couches anatomiques">COUCH</button>
        <button type="button" data-panel="info" aria-expanded="false" aria-controls="panel-info">INFO</button>
      </nav>
      <section id="viewport">
        <div class="panel" id="panel-couches" hidden>
          <h2>Couches anatomiques</h2>
          <fieldset class="couches" id="cp-couches">
            <legend>Afficher / masquer</legend>
            <label class="maitre" for="cp-couche-all">
              <input type="checkbox" aria-label="Toutes les couches" id="cp-couche-all" checked /> Toutes les couches
            </label>
            <label for="cp-couche-skin"><input type="checkbox" aria-label="Peau" id="cp-couche-skin" data-layer="skin" checked /> Peau</label>
            <label for="cp-couche-muscles"><input type="checkbox" aria-label="Muscles" id="cp-couche-muscles" data-layer="muscles" checked /> Muscles</label>
            <label for="cp-couche-facial"><input type="checkbox" aria-label="Muscles du visage" id="cp-couche-facial" data-layer="facial" checked /> Muscles du visage</label>
            <label for="cp-couche-skeleton"><input type="checkbox" aria-label="Squelette" id="cp-couche-skeleton" data-layer="skeleton" checked /> Squelette</label>
            <label for="cp-couche-organs"><input type="checkbox" aria-label="Organes" id="cp-couche-organs" data-layer="organs" checked /> Organes</label>
            <label for="cp-couche-vessels"><input type="checkbox" aria-label="Vaisseaux" id="cp-couche-vessels" data-layer="vessels" checked /> Vaisseaux</label>
            <label for="cp-couche-nerves"><input type="checkbox" aria-label="Nerfs" id="cp-couche-nerves" data-layer="nerves" checked /> Nerfs</label>
            <label for="cp-couche-cosmetic"><input type="checkbox" aria-label="Cheveux et sourcils" id="cp-couche-cosmetic" data-layer="cosmetic" checked /> Cheveux et sourcils</label>
            <label for="cp-couche-pregnancy"><input type="checkbox" aria-label="Grossesse — référence" id="cp-couche-pregnancy" data-layer="pregnancy" /> Grossesse — référence</label>
          </fieldset>
          <div class="presets" aria-label="Préréglages d'affichage">
            <button type="button" id="cp-preset-skin" title="N'afficher que la peau et les cheveux">Peau</button>
            <button type="button" id="cp-preset-muscles" title="N'afficher que les muscles">Muscles</button>
            <button type="button" id="cp-preset-skeleton" title="N'afficher que le squelette">Squelette</button>
            <button type="button" id="cp-preset-organs" title="N'afficher que les organes">Organes</button>
            <button type="button" id="cp-preset-face" title="N'afficher que les muscles du visage">Visage</button>
            <button type="button" id="cp-preset-xray" aria-pressed="true" title="Afficher tous les calques en transparence">Rayon X</button>
          </div>
        </div>
        <div class="panel" id="panel-info" hidden>
          <h2>Information</h2>
          <div id="corps-info">Chargement…</div>
          <p id="source-sexe-note" class="source-note">—</p>
          <p class="avertissement">Usage pédagogique uniquement. Ne remplace ni un diagnostic ni un avis médical.</p>
        </div>
        <div id="cp-view" tabindex="0" role="application" aria-label="Vue 3D interactive du corps humain"></div>
        <div id="nav-commands" aria-label="Commandes de navigation 3D">
          <button type="button" id="nav-zoom-in" aria-label="Zoomer">+</button>
          <button type="button" id="nav-zoom-out" aria-label="Dézoomer">−</button>
          <button type="button" id="nav-fit" aria-label="Cadrer le modèle">CADRER</button>
          <button type="button" id="nav-reset" aria-label="Réinitialiser la vue">RESET</button>
          <button type="button" id="nav-focus-male" aria-label="Pivoter autour de l'homme">H</button>
          <button type="button" id="nav-focus-female" aria-label="Pivoter autour de la femme">F</button>
        </div>
        <div id="pivot-indicator" aria-live="polite">Pivot : ensemble</div>
        <div id="selection-popup" hidden role="dialog" aria-modal="false" aria-live="polite" aria-label="Détails de la structure">
          <button type="button" id="selection-close" aria-label="Fermer la sélection">×</button>
          <h2 id="selection-name"></h2>
          <p id="selection-description"></p>
          <p id="selection-source" class="source-note"></p>
        </div>
      </section>
    </main>
    <script type="module">
      import { initCorpsViewer } from './src/corps-viewer.js';
      const toolbarButtons = [...document.querySelectorAll('#toolbar button[data-panel]')];
      for (const button of toolbarButtons) {
        button.addEventListener('click', () => {
          const target = document.getElementById('panel-' + button.dataset.panel);
          const open = button.getAttribute('aria-expanded') === 'true';
          for (const other of toolbarButtons) {
            other.setAttribute('aria-expanded', 'false');
            document.getElementById('panel-' + other.dataset.panel).hidden = true;
          }
          if (!open) {
            target.hidden = false;
            button.setAttribute('aria-expanded', 'true');
          }
        });
      }
      const build = document.documentElement.dataset.build;
      if (build && build !== 'DEV') document.getElementById('build-label').textContent = build;
      try {
        initCorpsViewer();
      } catch (e) {
        document.getElementById('corps-info').textContent = 'Erreur de chargement du modèle';
        console.error(e);
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
      /* Détection de nouvelle version sans télécharger les modèles. */
      setTimeout(async () => {
        try {
          const r = await fetch(`./index.html?check=${Date.now()}`, { cache: 'no-store' });
          const html = await r.text();
          const found = html.match(/data-build="([^"]+)"/);
          if (found && found[1] !== build && found[1] !== 'DEV') {
            const btn = document.createElement('button');
            btn.id = 'update-btn';
            btn.textContent = `Nouvelle version ${found[1]} — Recharger`;
            btn.addEventListener('click', () => location.reload(true));
            document.getElementById('controles').appendChild(btn);
          }
        } catch { /* hors ligne : on garde la version courante */ }
      }, 8000);
    </script>
  </body>
</html>
