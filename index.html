<!doctype html>
<html lang="fr" data-build="DEV">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10151b" />
    <title>CORPS — Corps humain animé</title>
    <meta name="description" content="Corps humain 3D animé issu des modèles Blender : peau, muscles, squelette, organes, vaisseaux et nerfs, en six animations." />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <style>
      :root { color-scheme: dark; --paper:#10151b; --ink:#e8ecef; --muted:#9aa8b3; --line:#2b3540; --accent:#7fd4d0; }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.45 system-ui,sans-serif; overflow:hidden; }
      header { height:calc(58px + env(safe-area-inset-top)); display:flex; align-items:center; justify-content:space-between; gap:12px;
        padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));
        border-bottom:1px solid var(--line); background:#151c24; }
      .brand { display:flex; align-items:center; gap:12px; min-width:0; }
      .brand img { width:32px; height:32px; }
      .brand h1 { margin:0; font:600 18px/1.4 Georgia,serif; letter-spacing:.14em; }
      .build { color:var(--muted); font:11px/1.4 monospace; white-space:nowrap; }
      a.atlas { display:inline-flex; align-items:center; justify-content:center; min-height:44px; min-width:44px;
        padding:0 12px; border:1px solid var(--line); border-radius:8px; background:#202a35; color:var(--ink);
        text-decoration:none; font-size:13px; }
      a.atlas:active { transform:scale(.97); }
      main { height:calc(100vh - 58px - env(safe-area-inset-top)); display:grid; grid-template-columns:250px minmax(0,1fr); }
      #controles { padding:16px; overflow:auto; border-right:1px solid var(--line); background:#151c24; }
      #controles h2 { margin:0 0 16px; font-size:18px; }
      #controles label { display:block; margin:12px 0; color:var(--muted); font-size:12px; }
      select, button { width:100%; min-height:44px; margin-top:4px; padding:8px 12px; border:1px solid #44515f;
        border-radius:6px; background:#232e3a; color:var(--ink); font-size:15px; }
      button { cursor:pointer; }
      button:active, select:active { transform:scale(.98); filter:brightness(1.15); }
      select:focus-visible, button:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
      #corps-info { margin-top:16px; color:var(--muted); font-size:12px; }
      #cp-view { position:relative; min-width:0; min-height:0; overflow:hidden; }
      #cp-view canvas { display:block; width:100%; height:100%; touch-action:none; }
      @media (pointer:coarse) {
        #cp-view::after { content:'Glissez pour tourner · pincez pour zoomer'; position:absolute; left:8px; bottom:8px;
          background:rgba(0,0,0,.55); color:#e6e6e6; font-size:11px; padding:4px 8px; border-radius:6px; pointer-events:none; }
      }
      @media (max-width:700px) {
        main { grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); }
        #controles { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 12px; padding:12px;
          border-right:0; border-bottom:1px solid var(--line); }
        #controles h2 { grid-column:1/-1; margin:0 0 4px; font-size:15px; }
        #controles label { margin:4px 0; }
        #corps-info { grid-column:1/-1; margin-top:8px; }
        .build { display:none; }
      }
      .skip-link { position:absolute; left:8px; top:-48px; z-index:20; padding:8px 12px;
        background:#e8ecef; color:#10151b; border-radius:4px; font-size:13px; }
      .skip-link:focus { top:8px; }
      @media (prefers-reduced-motion:reduce) {
        *,*::before,*::after { transition-duration:.01ms !important; animation-duration:.01ms !important; }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#cp-view">Aller au corps 3D</a>
    <header>
      <div class="brand"><img src="./logo.svg" alt="" /><h1>CORPS</h1><span class="build" id="build-label"></span></div>
      <a class="atlas" href="./ancien-atlas.html">Ancien atlas</a>
    </header>
    <main>
      <aside id="controles">
        <h2>Corps humains animés</h2>
        <label>Sexe<select id="cp-sexe" aria-label="Sexe"><option value="female">Femme</option><option value="male">Homme</option></select></label>
        <label>Couche<select id="cp-couche" aria-label="Couche anatomique">
          <option value="skin">Peau</option><option value="muscles">Muscles</option>
          <option value="skeleton">Squelette</option><option value="organs">Organes</option>
          <option value="vessels">Vaisseaux</option><option value="nerves">Nerfs</option>
          <option value="all">Toutes</option>
        </select></label>
        <label>Animation<select id="cp-anim" aria-label="Animation">
          <option value="salsa">Salsa</option><option value="marche">Marche</option>
          <option value="etirement">Étirement</option><option value="tourbillon">Tourbillon</option>
          <option value="course">Course</option><option value="equilibre">Équilibre</option>
        </select></label>
        <button id="cp-pause" type="button" aria-pressed="false" aria-label="Pause ou reprise de l'animation">Pause</button>
        <div id="corps-info">Chargement…</div>
      </aside>
      <div id="cp-view" tabindex="-1"></div>
    </main>
    <script type="module">
      import { initCorpsViewer } from './src/corps-viewer.js';
      const build = document.documentElement.dataset.build;
      if (build && build !== 'DEV') document.getElementById('build-label').textContent = build;
      initCorpsViewer().catch((e) => {
        document.getElementById('corps-info').textContent = 'Erreur de chargement du modèle';
        console.error(e);
      });
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
      /* Détection de nouvelle version sans télécharger les modèles. */
      setTimeout(async () => {
        try {
          const r = await fetch(`./index.html?check=${Date.now()}`, { cache: 'no-store' });
          const html = await r.text();
          const found = html.match(/data-build="([^"]+)"/);
          if (found && found[1] !== build && found[1] !== 'DEV') {
            const btn = document.createElement('button');
            btn.id = 'update-btn';
            btn.textContent = `Nouvelle version ${found[1]} — Recharger`;
            btn.addEventListener('click', () => location.reload(true));
            document.getElementById('controles').appendChild(btn);
          }
        } catch { /* hors ligne : on garde la version courante */ }
      }, 8000);
    </script>
  </body>
</html>
