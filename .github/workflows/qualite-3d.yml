name: Qualité 3D

on:
  push:
    branches: [main]
  pull_request:

jobs:
  porte-qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium
      - name: Serveur de test
        run: |
          npm run dev -- --port 5199 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5199/v2.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1

      - name: Baseline topologique
        run: npm run audit:3d:check
      - name: Modèle livré
        run: npm run check:modele
      - name: Scorecard et écart LOD
        run: |
          npm run scorecard:3d
          npm run hausdorff:3d
      - name: Affirmations médicales
        run: npm run lint:claims
      - name: Tests données
        run: npm test
      - name: Tests 3D, a11y et groupes
        run: |
          npm run test:v2
          npm run test:a11y
          npm run test:groupes3d
      - name: Zéro requête réseau externe
        run: TEST_BASE=http://localhost:5199 npm run test:reseau
      - name: Rendu à la demande
        run: TEST_BASE=http://localhost:5199 npm run test:dirty
      - name: Deep links des waypoints
        run: TEST_BASE=http://localhost:5199 npm run test:deeplink
      - name: Catalogue des vues remarquables
        run: TEST_BASE=http://localhost:5199 npm run test:catalogue
      - name: Tours guidés
        run: TEST_BASE=http://localhost:5199 npm run test:tour
      - name: Coupes 3 axes
        run: TEST_BASE=http://localhost:5199 npm run test:coupes
      - name: Éclaté global
        run: TEST_BASE=http://localhost:5199 npm run test:explode
      - name: Identifiants source stables
        run: TEST_BASE=http://localhost:5199 npm run test:source-id
      - name: Fiches de vérité
        run: TEST_BASE=http://localhost:5199 npm run test:fiches
      - name: Registre des licences
        run: TEST_BASE=http://localhost:5199 npm run test:licences
      - name: Quiz multi-modes
        run: TEST_BASE=http://localhost:5199 npm run test:quiz-modes
      - name: Étiquettes ancrées
        run: TEST_BASE=http://localhost:5199 npm run test:labels
      - name: Identité GPU
        run: TEST_BASE=http://localhost:5199 npm run test:identity-gpu
      - name: Textures CC0
        run: TEST_BASE=http://localhost:5199 npm run test:textures
      - name: Signatures de revue humaine
        run: npm run test:review
      - name: Pages statiques et sitemap
        run: npm run test:pages
      - name: Build
        run: npm run build
      - name: Gates runtime (budget et repli LOD)
        run: npm run test:runtime
