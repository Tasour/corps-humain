name: Anatomie animée

on:
  push:
    paths:
      - 'docs/analyses/**'
      - 'docs/models/**'
      - 'docs/videos/**'
      - 'scripts/*humain*'
      - 'scripts/retarget-mocap.py'
      - 'scripts/scapulohumeral.py'
      - 'tests/final-product.test.mjs'
      - 'package.json'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Vérifier le produit final
        run: npm run test:produit
      - name: Vérifier la complétude
        run: npm run verif:completude
      - name: Vérifier le rapport
        run: npm run verif:anatomie
